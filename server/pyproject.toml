[project]
name = "xichuang"
version = "0.1.0"
description = "西窗 XiChuang - A multimodal chatbot with LangChain, LangGraph, and FastAPI supporting text, audio, image, and video. 「何当共剪西窗烛，却话巴山夜雨时」"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "langchain>=0.3.0",
    "langgraph>=0.1.0",
    "langchain-openai>=0.2.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4",
    "itsdangerous>=2.2.0",
    "pillow>=10.3.0",
    "moviepy>=1.0.3",
    "pydub>=0.25.1",
    "openai>=1.37.0",
    "orjson>=3.10.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "faiss-cpu>=1.8.0",
    "pymilvus>=2.3.0",
    "dashscope>=1.14.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "aiomysql>=0.2.0",
    "xmltodict>=1.0.4",
    "pypinyin>=0.55.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = false

